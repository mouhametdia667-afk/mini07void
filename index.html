
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080510">
<link rel="manifest" href="./manifest.json">
<title>VOID</title>

<style>
* {
 box-sizing: border-box;
}

body {
 margin: 0;
 background: #080510;
 color: white;
 font-family: Arial, sans-serif;
 min-height: 100vh;
}

/* ANIMATION D'OUVERTURE */

#intro {
 position: fixed;
 inset: 0;
 z-index: 1000;
 background: radial-gradient(circle, #1b0930, #080510 70%);
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 overflow: hidden;
 transition: opacity 1s ease, visibility 1s ease;
}

#intro.hide {
 opacity: 0;
 visibility: hidden;
}

.particles {
 position: absolute;
 inset: 0;
 pointer-events: none;
 background-image:
 radial-gradient(2px 2px at 20% 30%, #c78aff, transparent),
 radial-gradient(2px 2px at 70% 20%, #a000ff, transparent),
 radial-gradient(2px 2px at 40% 80%, #ffffff, transparent),
 radial-gradient(2px 2px at 85% 70%, #bc8aff, transparent),
 radial-gradient(2px 2px at 15% 75%, #a000ff, transparent);
 background-size: 180px 180px;
 animation: stars 5s linear infinite;
}

@keyframes stars {
 from { transform: translateY(0); }
 to { transform: translateY(-80px); }
}

.intro-logo {
 width: 110px;
 height: 110px;
 border-radius: 30px;
 display: grid;
 place-items: center;
 font-size: 75px;
 font-weight: bold;
 color: white;
 background: linear-gradient(135deg, #a000ff, #31006c);
 box-shadow: 0 0 25px #a000ff, 0 0 80px #8b00ff88;
 animation: logoAppear 1.2s ease both;
}

@keyframes logoAppear {
 from {
  opacity: 0;
  transform: scale(0.3) rotate(-25deg);
 }
 to {
  opacity: 1;
  transform: scale(1) rotate(0);
 }
}

.intro-avatar {
 width: 145px;
 height: 145px;
 margin-top: 28px;
 border-radius: 50%;
 border: 2px solid #a000ff;
 overflow: hidden;
 box-shadow: 0 0 35px #a000ff;
 opacity: 0;
 animation: avatarAppear 1s ease 1.3s forwards;
}

.intro-avatar img {
 width: 100%;
 height: 100%;
 object-fit: cover;
}

@keyframes avatarAppear {
 from {
  opacity: 0;
  transform: scale(0.5);
 }
 to {
  opacity: 1;
  transform: scale(1);
 }
}

.intro-title {
 margin-top: 22px;
 font-size: 27px;
 letter-spacing: 7px;
 color: #d7aaff;
 opacity: 0;
 animation: textAppear 1s ease 2s forwards;
}

.intro-subtitle {
 margin-top: 9px;
 font-size: 11px;
 letter-spacing: 4px;
 color: #a98bc2;
 opacity: 0;
 animation: textAppear 1s ease 2.4s forwards;
}

@keyframes textAppear {
 from { opacity: 0; transform: translateY(15px); }
 to { opacity: 1; transform: translateY(0); }
}

#skipIntro {
 position: absolute;
 bottom: 35px;
 right: 25px;
 padding: 11px 18px;
 border: 1px solid #8736bd;
 border-radius: 20px;
 background: #1b0b2b;
 color: white;
 font-size: 12px;
 letter-spacing: 1px;
 cursor: pointer;
}

/* SITE */

header {
 padding: 22px 18px;
 border-bottom: 1px solid #462078;
 display: flex;
 align-items: center;
 gap: 12px;
}

.logo {
 width: 45px;
 height: 45px;
 border-radius: 15px;
 background: linear-gradient(135deg,#a000ff,#31006c);
 display: grid;
 place-items: center;
 font-size: 25px;
 font-weight: bold;
 box-shadow: 0 0 18px #a000ff88;
}

h1 {
 font-size: 19px;
 margin: 0;
}

.status {
 font-size: 11px;
 color: #bc8aff;
 margin-top: 5px;
}

main {
 max-width: 600px;
 margin: auto;
 padding: 22px 16px;
}

.hero {
 text-align: center;
 padding: 30px 0;
}

.avatar {
 width: 160px;
 height: 160px;
 margin: auto;
 border-radius: 50%;
 border: 2px solid #a000ff;
 background: #10051e;
 overflow: hidden;
 box-shadow: 0 0 35px #9c00ff88;
}

.avatar img {
 width: 100%;
 height: 100%;
 display: block;
 object-fit: cover;
}

.hero h2 {
 color: #c18aff;
 font-size: 26px;
}

.hero p {
 color: #aaa;
 font-size: 13px;
}

.chat {
 background: #130c20;
 border: 1px solid #462078;
 border-radius: 18px;
 padding: 15px;
 min-height: 190px;
}

.message {
 padding: 12px 14px;
 margin: 10px 0;
 border-radius: 14px;
 font-size: 14px;
 line-height: 1.5;
 max-width: 90%;
}

.bot {
 background: #29133e;
 border: 1px solid #6526a0;
}

.user {
 background: #6414a1;
 margin-left: auto;
}

form {
 display: flex;
 gap: 8px;
 margin-top: 14px;
}

input {
 flex: 1;
 min-width: 0;
 padding: 14px;
 background: #160d24;
 border: 1px solid #7432a8;
 border-radius: 13px;
 color: white;
 font-size: 14px;
}

button {
 border: 0;
 border-radius: 13px;
 padding: 0 17px;
 color: white;
 background: #8614d6;
 font-size: 18px;
}

#voiceStatus {
 color: #bc8aff;
 font-size: 12px;
}

footer {
 text-align: center;
 color: #78678c;
 font-size: 11px;
 margin: 22px;
}

@media (prefers-reduced-motion: reduce) {
 #intro, .particles, .intro-logo,
 .intro-avatar, .intro-title, .intro-subtitle {
  animation: none;
  transition: none;
 }
 .intro-avatar, .intro-title, .intro-subtitle {
  opacity: 1;
 }
}
</style>
</head>

<body>

<!-- INTRO VOID -->

<div id="intro">
 <div class="particles"></div>

 <div class="intro-logo">V</div>

 <div class="intro-avatar">
  <img src="file_000000001e5881f4b0f0dea71c2a3327.png"
       alt="Personnage VOID">
 </div>

 <div class="intro-title">VOID</div>
 <div class="intro-subtitle">BEYOND REALITY</div>

 <button id="skipIntro">PASSER ➜</button>
</div>

<header>
 <div class="logo">V</div>
 <div>
  <h1>VOID</h1>
  <div class="status">● EN LIGNE</div>
 </div>
</header>

<main>

 <section class="hero">
  <div class="avatar">
   <img src="file_000000001e5881f4b0f0dea71c2a3327.png"
        alt="Personnage VOID">
  </div>

  <h2>BEYOND REALITY</h2>
  <p>Une intelligence à tes côtés.</p>
 </section>

 <section class="chat" id="chat">
  <div class="message bot">
   Salut ! Je suis VOID.<br>
   Mon univers vient de s'éveiller. 🌌<br>
   Que veux-tu savoir ?
  </div>
 </section>

 <form id="form">
  <input id="message"
         placeholder="Écris ou parle à VOID..."
         autocomplete="off">
  <button type="button" id="mic">🎙️</button>
  <button type="submit">➤</button>
 </form>

 <p id="voiceStatus"></p>

</main>

<footer>VOID © 2026 — PERSONAL AI</footer>

<script>
/* INTRO */

const intro = document.getElementById("intro");
const skipIntro = document.getElementById("skipIntro");

function closeIntro() {
 if (intro.classList.contains("hide")) return;
 intro.classList.add("hide");
}

const introTimer = setTimeout(closeIntro, 4500);

skipIntro.addEventListener("click", () => {
 clearTimeout(introTimer);
 closeIntro();
});

/* CHAT */

const form = document.getElementById("form");
const input = document.getElementById("message");
const chat = document.getElementById("chat");
const mic = document.getElementById("mic");
const status = document.getElementById("voiceStatus");

function addMessage(text, type) {
 const div = document.createElement("div");
 div.className = "message " + type;
 div.textContent = text;
 chat.appendChild(div);
 chat.scrollTop = chat.scrollHeight;
}

form.addEventListener("submit", function(e) {
 e.preventDefault();

 const question = input.value.trim();
 if (!question) return;

 addMessage(question, "user");
 input.value = "";

 setTimeout(() => {
  const answer =
   "Je suis VOID. Mon intelligence est en cours de connexion. Que souhaites-tu découvrir aujourd'hui ?";
  addMessage(answer, "bot");
 }, 500);
});

/* MICRO */

const SpeechRecognition =
 window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
 const recognition = new SpeechRecognition();

 recognition.lang = "fr-FR";
 recognition.continuous = false;
 recognition.interimResults = false;

 let listening = false;

 function updateMicButton(active) {
  listening = active;
  mic.textContent = active ? "⏹️" : "🎙️";
  mic.title = active ? "Arrêter l'écoute" : "Parler";
  mic.setAttribute("aria-label", mic.title);
 }

 mic.addEventListener("click", () => {
  if (listening) {
   recognition.stop();
   updateMicButton(false);
   status.textContent = "Écoute arrêtée.";
   return;
  }

  try {
   updateMicButton(true);
   status.textContent = "VOID écoute...";
   recognition.start();
  } catch (e) {
   updateMicButton(false);
   status.textContent = "Réessaie dans un instant.";
  }
 });

 recognition.onresult = (event) => {
  input.value = event.results[0][0].transcript;
  status.textContent = "Paroles transcrites !";
 };

 recognition.onerror = (event) => {
  updateMicButton(false);
  status.textContent = "Erreur micro : " + event.error;
  console.log("Erreur VOID :", event.error);
 };

 recognition.onend = () => {
  updateMicButton(false);

  if (status.textContent === "VOID écoute...") {
   status.textContent = "Écoute arrêtée.";
  }
 };

} else {
 mic.disabled = true;
 status.textContent = "Reconnaissance vocale non prise en charge.";
}
</script>

<script>
if ("serviceWorker" in navigator) {
 window.addEventListener("load", () => {
  navigator.serviceWorker.register("./service-worker.js")
   .then(() => console.log("VOID est prêt !"))
   .catch(error => console.log("Erreur VOID :", error));
 });
}
</script>

</body>
</html>
